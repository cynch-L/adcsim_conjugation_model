[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adcsim"
version = "0.1.0"
description = "Cysteine-conjugation spatial ADC builder (DAR funnel + structural QC)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "biopython",
  "rdkit",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The DXd / AlphaFold case needs a structure the user folds on Kaggle; it skips
# when absent, so a clean checkout is green without it.
addopts = "-ra"
